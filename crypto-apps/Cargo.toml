[workspace]
members = [
    "src",
    "network",
    "security",
    "tools"
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.32", features = ["full"] }
futures = "0.3"
ring = "0.17"
secp256k1 = { version = "0.27", features = ["rand"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libp2p = { version = "0.52", features = ["full"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
